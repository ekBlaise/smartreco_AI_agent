{# Digest email. Table-based and inline-styled — email clients ignore <style> and flexbox. #}
<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#0b0d12;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" border="0"
           style="max-width:600px;background:#12151d;border:1px solid #232838;border-radius:14px;overflow:hidden;">

      <tr><td style="padding:26px 30px 0;">
        <div style="font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#a99bff;font-weight:700;">
          Smart<span style="color:#e8eaf0">Reco</span> · picked for you
        </div>
      </td></tr>

      <tr><td style="padding:16px 30px 0;">
        <h1 style="margin:0 0 12px;font-size:23px;line-height:1.3;color:#e8eaf0;font-weight:650;">
          {{ reco.headline }}
        </h1>
        <p style="margin:0 0 8px;font-size:15px;line-height:1.65;color:#99a1b3;">
          {{ reco.narrative }}
        </p>
        {% if reco.cta %}
          <p style="margin:14px 0 0;font-size:15px;color:#a99bff;font-weight:600;">{{ reco.cta }}</p>
        {% endif %}
      </td></tr>

      <tr><td style="padding:22px 30px 8px;">
        {% for item in reco['items'] %}
          <table width="100%" cellpadding="0" cellspacing="0" border="0"
                 style="background:#0b0d12;border:1px solid #232838;border-radius:10px;margin-bottom:12px;">
            <tr>
              <td width="38" valign="top" style="padding:15px 0 15px 15px;">
                <div style="width:24px;height:24px;border-radius:6px;background:rgba(124,108,245,.16);
                            color:#a99bff;font-size:12px;font-weight:700;text-align:center;line-height:24px;">
                  {{ loop.index }}
                </div>
              </td>
              <td style="padding:15px 15px 15px 8px;">
                <a href="{{ base_url }}/course/{{ item.slug }}"
                   style="color:#e8eaf0;font-size:15px;font-weight:600;text-decoration:none;">
                  {{ item.title }}
                </a>
                <p style="margin:5px 0 0;font-size:13px;line-height:1.55;color:#99a1b3;">
                  {{ item.why_this }}
                </p>
                <p style="margin:9px 0 0;font-size:12px;color:#6b7386;">
                  {{ item.category }} · {{ item.level }} ·
                  {% if item.price %}${{ "%.0f"|format(item.price) }}{% else %}Free{% endif %}
                </p>
              </td>
            </tr>
          </table>
        {% endfor %}
      </td></tr>

      <tr><td align="center" style="padding:10px 30px 30px;">
        <a href="{{ base_url }}/dashboard"
           style="display:inline-block;background:#7c6cf5;color:#ffffff;text-decoration:none;
                  padding:12px 26px;border-radius:8px;font-size:14px;font-weight:600;">
          Open your recommendations
        </a>
      </td></tr>

      <tr><td style="padding:18px 30px;border-top:1px solid #232838;">
        <p style="margin:0;font-size:11px;line-height:1.6;color:#6b7386;">
          Generated from your activity on {{ generated_at.strftime('%d %B %Y') }} by the
          {{ app_name }} recommendation agent. Every course above comes from the live
          catalog — nothing here is invented.
        </p>
      </td></tr>

    </table>
  </td></tr>
</table>
