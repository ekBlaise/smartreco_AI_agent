name: smartreco

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartreco
      POSTGRES_PASSWORD: smartreco
      POSTGRES_DB: smartreco
    # Host port is configurable: a locally-installed PostgreSQL on 5432 would
    # otherwise shadow this container and fail auth in confusing ways.
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartreco"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.1   # keep in step with qdrant-client in requirements.txt
    ports: ["${QDRANT_PORT:-6333}:6333", "${QDRANT_GRPC_PORT:-6334}:6334"]
    volumes: [qdrantdata:/qdrant/storage]

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://smartreco:smartreco@postgres:5432/smartreco
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    volumes: [./data:/app/data]

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://smartreco:smartreco@postgres:5432/smartreco
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    volumes: [./data:/app/data]

  beat:
    build: .
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://smartreco:smartreco@postgres:5432/smartreco
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      redis: {condition: service_healthy}
    volumes: [./data:/app/data]

volumes:
  pgdata:
  qdrantdata:
